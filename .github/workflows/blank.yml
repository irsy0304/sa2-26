steps:
  - name: Install netcat
    run: sudo apt update && sudo apt install -y netcat curl

  - name: Диагностика сети
    run: |
      echo "=== Проверка DNS ==="
      nslookup onliner.by || host onliner.by
      echo "=== Проверка пинга (ICMP) ==="
      ping -c 2 onliner.by || echo "Пинг не работает (это нормально для многих серверов)"
      echo "=== Проверка порта 443 через nc ==="
      nc -zv -w5 onliner.by 443 || echo "nc завершился с ошибкой"
      echo "=== Проверка через curl ==="
      curl -v --connect-timeout 5 https://onliner.by:443 || echo "curl завершился с ошибкой"

  - name: Проверка подключения (curl)
    id: check
    run: |
      if curl -s --connect-timeout 5 https://onliner.by:443 > /dev/null; then
        echo "✅ Подключение успешно"
        echo "status=success" >> $GITHUB_OUTPUT
      else
        echo "❌ Не удалось подключиться"
        echo "status=failed" >> $GITHUB_OUTPUT
        exit 1
      fi

  - name: Загрузка отчёта
    if: always()  # Загружает лог, даже если шаг проверки упал
    uses: actions/upload-artifact@v4
    with:
      name: diagnostic-logs
      path: |
        /tmp/*.log
        ./**/*.log
