name: Check remote host and report

on:
  push:
    branches:
      - master
      - second

jobs:
  prepare:
    runs-on: ubuntu-latest  # или my_runner, если есть
    steps:
      - name: Install netcat
        run: sudo apt update && sudo apt install -y netcat
      
      - name: Test connection to onliner.by
        run: |
          nc -z -v -w2 onliner.by 443 > nc_report.log 2>&1
          cat nc_report.log
          
      - name: Verify result
        run: |
          if grep -q "open" nc_report.log; then
            echo "✅ Connection successful"
          else
            echo "❌ Connection failed"
            exit 1
          fi
          
      - name: Upload report
        uses: actions/upload-artifact@v4  # лучше использовать v4
        with:
          name: nc-report
          path: nc_report.log
